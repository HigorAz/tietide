name: Project Sync

on:
  pull_request:
    types: [closed]

jobs:
  sync-status-to-done:
    name: Move linked issues to Done
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_PAT }}
      PROJECT_ID: PVT_kwHOCHOCYc4BTer2
      STATUS_FIELD_ID: PVTSSF_lAHOCHOCYc4BTer2zhAtYEU
      DONE_OPTION_ID: '98236657'
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Resolve closing issues and set status to Done
        run: |
          set -euo pipefail

          issue_numbers=$(gh api graphql -f query='
            query($owner:String!, $repo:String!, $pr:Int!) {
              repository(owner:$owner, name:$repo) {
                pullRequest(number:$pr) {
                  closingIssuesReferences(first:20) { nodes { number } }
                }
              }
            }' -F owner="$REPO_OWNER" -F repo="$REPO_NAME" -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number')

          if [ -z "$issue_numbers" ]; then
            echo "No closing issues referenced by PR #$PR_NUMBER. Nothing to do."
            exit 0
          fi

          for issue in $issue_numbers; do
            echo "Looking up project item for issue #$issue"

            item_id=$(gh api graphql -f query='
              query($owner:String!, $repo:String!, $issue:Int!) {
                repository(owner:$owner, name:$repo) {
                  issue(number:$issue) {
                    projectItems(first:20) { nodes { id project { id } } }
                  }
                }
              }' -F owner="$REPO_OWNER" -F repo="$REPO_NAME" -F issue="$issue" \
              --jq ".data.repository.issue.projectItems.nodes[] | select(.project.id == \"$PROJECT_ID\") | .id")

            if [ -z "$item_id" ]; then
              echo "Issue #$issue is not on project $PROJECT_ID. Skipping."
              continue
            fi

            echo "Setting status=Done for project item $item_id (issue #$issue)"
            gh api graphql -f query='
              mutation($project:ID!, $item:ID!, $field:ID!, $option:String!) {
                updateProjectV2ItemFieldValue(input:{
                  projectId:$project,
                  itemId:$item,
                  fieldId:$field,
                  value:{ singleSelectOptionId:$option }
                }) { projectV2Item { id } }
              }' \
              -F project="$PROJECT_ID" \
              -F item="$item_id" \
              -F field="$STATUS_FIELD_ID" \
              -f option="$DONE_OPTION_ID" >/dev/null
          done
