name: Secret Scan

# Scans the full git history for committed secrets (API keys, tokens, private
# keys, etc.) on every push and PR. Fails the build if anything is found, so a
# leaked credential is caught before it ever reaches a reviewer or main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the scan only checks out and reads the repo history.
permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          # Full history is required so gitleaks can scan every commit, not just
          # the tip — a secret added and later removed still leaks once public.
          fetch-depth: 0

      # Run gitleaks from its official Docker image rather than the GitHub Action:
      # the action gates org usage behind a license key and installs a pinned
      # binary; the Docker image is license-free for this use and stays pinnable.
      - name: Scan repository history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --config /repo/.gitleaks.toml \
              --redact --verbose --exit-code 1
