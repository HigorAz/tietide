name: Publish Images

# Publish signed release images to GHCR. Runs only on version tags (and manual
# dispatch) — NOT on every push to main: the prod deploy builds images locally
# from source (docker-compose.prod.yml + docs/deployment.md), so nothing pulls
# these per-commit. Cutting a v* tag is what produces a published, signed image.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write
  id-token: write # required for keyless cosign signing (OIDC)

jobs:
  publish:
    name: Build & push ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, spa, ai]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: |
          owner_lc="${IMAGE_NAMESPACE,,}"
          echo "name=ghcr.io/${owner_lc}/tietide-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # Immutable, traceable tags only: the commit sha and (for tag
          # pushes) the semver. The floating :latest tag is intentionally
          # NOT published — consumers should pin to a sha or semver digest.
          tags: |
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=tietide-${{ matrix.app }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Build once, load locally, and scan BEFORE pushing so a vulnerable
      # image never reaches the registry.
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          # Build the lean runtime stage explicitly: without a target, BuildKit
          # builds the LAST stage, which for the API is `migrate` (carries a
          # vendored prisma CLI with its own vulnerable transitive deps). The
          # runtime stage is what should ship and what must be scanned.
          target: runtime
          push: false
          load: true
          tags: tietide-${{ matrix.app }}:scan
          # Bump the cache scope (-v2) to drop stale layers that still carried
          # already-fixed dependency versions from older builds.
          cache-from: type=gha,scope=${{ matrix.app }}-v2
          cache-to: type=gha,scope=${{ matrix.app }}-v2,mode=max

      # Run Trivy from its Docker Hub image instead of aquasecurity/trivy-action:
      # the action installs the binary from GitHub Releases, but Aqua keeps release
      # assets ONLY on the latest Trivy version, so any pinned version 404s on
      # install. Docker Hub tags are retained permanently and stay pinnable.
      # The vulnerable image stays local (load: true above) and is never pushed
      # if a fixable HIGH/CRITICAL is found (--exit-code 1 fails the job).
      - name: Scan image for vulnerabilities (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.71.0 image \
              --exit-code 1 \
              --ignore-unfixed \
              --severity HIGH,CRITICAL \
              --pkg-types os,library \
              --format table \
              tietide-${{ matrix.app }}:scan

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          # Push the same runtime stage that was just scanned (see note above).
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}-v2
          cache-to: type=gha,scope=${{ matrix.app }}-v2,mode=max
          provenance: mode=max # SLSA build provenance attestation
          sbom: true # generate + attach an SBOM attestation

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless (OIDC) signature bound to the immutable digest — no long-lived
      # private key to manage. Verifiable with:
      #   cosign verify <image>@<digest> \
      #     --certificate-identity-regexp '.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign image by digest
        env:
          COSIGN_YES: 'true'
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign "${IMAGE_NAME}@${IMAGE_DIGEST}"
