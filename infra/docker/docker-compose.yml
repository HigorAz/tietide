services:
  postgres:
    image: postgres:16-alpine
    # Without a restart policy, a docker daemon restart (or any stray `docker
    # stop`/`compose down`) leaves the DB down permanently — which crash-loops the
    # host-run API into a 502 and never self-heals on the WSL prod box.
    restart: unless-stopped
    # Bind to loopback ONLY. Host-run apps (and the WSL prod box, which runs the
    # API on the host against this compose) still reach it on localhost:5432, but
    # the DB is no longer published on every host interface to the network/internet.
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tietide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tietide_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tietide}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tietide}']
      interval: 5s
      timeout: 3s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # Bind to loopback ONLY — host-run apps reach it on localhost:6379, but the
    # queue is never published on a public interface. When REDIS_PASSWORD is set
    # in .env, require AUTH on the connection too (the host apps pass the same var).
    command: ['sh', '-c', 'exec valkey-server ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli ${REDIS_PASSWORD:+-a "$REDIS_PASSWORD"} ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    # Offload inference to an NVIDIA GPU when one is present (needs the NVIDIA
    # Container Toolkit on the host). Falls back to CPU automatically if absent.
    # Cuts llama3.1:8b docs generation from minutes (CPU) to seconds (GPU).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # The ollama image ships neither curl nor wget, so a curl-based check is
    # permanently "unhealthy" — which blocks dependents (the ai service) from
    # starting. `ollama list` hits the local server via the bundled CLI.
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    ports:
      - '8001:8000'
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: 'false'

  # FastAPI documentation service. The host-run NestJS API reaches it on
  # localhost:8000 (AI_SERVICE_URL); inside the compose network it reaches
  # chromadb/ollama by service name. Without this, `POST .../documentation/
  # regenerate` returns 503 ("AI service request failed: fetch failed").
  ai:
    build:
      context: ../..
      dockerfile: apps/ai/Dockerfile
    image: tietide-ai:latest
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - ../../.env
    # Service-name overrides win over .env so the container reaches the compose
    # network, not the host's localhost. CHROMA listens on 8000 INSIDE its
    # container (the host publishes it as 8001 — internal traffic uses 8000).
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: '8000'
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
      chromadb:
        condition: service_started

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'

volumes:
  postgres_data:
  valkey_data:
  ollama_data:
  chroma_data:
